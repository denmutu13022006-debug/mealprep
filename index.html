<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мил-преп</title>
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мил-преп">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f6f2; --card:#ffffff; --ink:#1d2a22; --muted:#66756b; --line:#e1e7df;
  --accent:#2f7d4f; --accent-ink:#ffffff; --soft:#e5f1e9; --warn:#b4641c; --bad:#b3372f; --ok:#2f7d4f;
  --chip:#eef2ec; --shadow:0 1px 2px rgba(20,40,28,.06),0 4px 14px rgba(20,40,28,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --card:#1b231e; --ink:#e8eee9; --muted:#9aa9a0; --line:#2b362f;
    --accent:#58b67f; --accent-ink:#0e1a13; --soft:#213328; --warn:#e0944a; --bad:#e2776f; --ok:#58b67f;
    --chip:#242e28; --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#view{max-width:720px;margin:0 auto;padding:0 16px}
h1{font-size:26px;margin:2px 0 0;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:16px;margin:2px 0 8px}
h3.sub{margin-top:14px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hero{padding:calc(18px + env(safe-area-inset-top)) 0 12px}
.hl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hs{font-size:14px;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.card.skipped{opacity:.55}
.card.current{border-color:var(--accent)}
.mh{display:flex;gap:10px;align-items:flex-start}
.mi{font-size:26px;line-height:1}
.mt{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);margin-left:4px}
.tag.frz{background:#dcebf7;color:#1c4a73}.tag.fr{background:var(--soft);color:var(--accent)}.tag.fresh{background:#fbeccb;color:#7a5410}
@media (prefers-color-scheme: dark){.tag.frz{background:#1d3347;color:#9cc8ec}.tag.fresh{background:#3a2e14;color:#e8c779}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:13px;background:var(--chip);border-radius:8px;padding:2px 8px}
.chip.kcal{background:var(--soft);color:var(--accent);font-weight:600}
.chip.cost{background:#fbeccb;color:#7a5410}
@media (prefers-color-scheme: dark){.chip.cost{background:#3a2e14;color:#e8c779}}
details{margin:6px 0 10px}
summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:15px;padding:4px 0}
.ing,.kv,.shop,.prices,.tl{list-style:none;margin:8px 0;padding:0}
.ing li,.kv li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.ing li b,.kv li b{text-align:right;font-weight:600}
.kv.small li{font-size:14px;padding:4px 0}
.kv.small li span{flex:0 0 24px}
.kv.small li b{font-weight:500;text-align:left;flex:1}
em{color:var(--muted);font-style:normal;font-size:.92em}
.steps{padding-left:20px;margin:8px 0;font-size:15px}.steps li{margin:4px 0}
.hint{font-size:14px;color:var(--muted);margin:8px 0}
.notice{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:15px}
.notice.freeze{background:#e3eef8;color:#1c4a73}.notice.cook{background:#fbeccb;color:#7a5410}
@media (prefers-color-scheme: dark){.notice.freeze{background:#1d3347;color:#b8d8f2}.notice.cook{background:#3a2e14;color:#e8c779}}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;padding:0;cursor:pointer;text-decoration:underline}
.btn{display:block;width:100%;border-radius:12px;border:1px solid var(--accent);padding:11px 14px;font:inherit;font-weight:600;cursor:pointer;margin-top:8px;text-align:center;background:none;color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.danger{color:var(--bad)}
.filebtn input{display:none}
.mini{border:1px solid var(--line);background:none;color:var(--muted);border-radius:10px;padding:5px 8px;font:inherit;font-size:13px;cursor:pointer;flex:0 0 auto}
.bar-row{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:8px;font-size:14px;margin:7px 0}
.bar{position:relative;height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar.wide{height:14px;overflow:visible;border-radius:7px}
.bar i{display:block;height:100%;border-radius:inherit}
.bar i.ok{background:var(--ok)}.bar i.mid{background:var(--warn)}.bar i.lo{background:#7aa7c9}.bar i.hi{background:var(--bad)}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6}
.bnote{margin-top:8px}.bnote small{color:var(--muted)}
.drow{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:12px}
.drow.today{background:var(--soft)}
.dn{display:flex;flex-direction:column;min-width:80px}.dn small{color:var(--muted);font-size:12px}
.dm{display:flex;gap:6px}
.mb{position:relative;width:46px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.mb.sk{opacity:.35;text-decoration:line-through;background:var(--chip)}
.mb i{position:absolute;right:2px;bottom:-1px;font-size:11px;font-style:normal}
.mb:disabled{cursor:default}
.shop li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.shop li.done .si div{text-decoration:line-through;color:var(--muted)}
.shop li.have .si small{color:var(--muted)}
.si{flex:1;min-width:0}.si small{color:var(--muted);display:block}
.ck{display:inline-flex;flex:0 0 auto}.ck input{display:none}
.ck span{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:inline-block}
.ck input:checked+span{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--card)}
.tl li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.tl li b{flex:0 0 44px;color:var(--accent)}
.seg{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px;margin:0 0 12px}
.seg.two{margin:0 0 10px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:8px 6px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.fld{display:block;margin:10px 0;font-size:14px;color:var(--muted)}
.fld input,.fld select,.prices input{display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.prices li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.prices li small{color:var(--muted)}
.prices input{width:88px;margin:0;text-align:right}
.wh{display:flex;align-items:center;gap:6px}.wh h3{margin:0}
.lang{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;z-index:6;box-shadow:var(--shadow)}
.lang button{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--accent-ink)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 2px 7px;font:inherit;font-size:12px;cursor:pointer}
nav button span{display:block;font-size:21px;line-height:1.1}
nav button.on{color:var(--accent);font-weight:700}
@media (min-width:760px){nav{left:50%;transform:translateX(-50%);max-width:720px;border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:0}}
</style>
</head>
<body>
<div id="lang" class="lang"></div>
<main id="view"></main>
<nav id="nav"></nav>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
